<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="title desc"><title id="title">Puzzle penelitian: cakupan relasi intra-kelas</title><desc id="desc">SoTA menuju research gap sementara, pengujian empiris dan analitis potensial, lalu kontribusi potensial. Panah adalah alur argumentasi, bukan sebab terbukti.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5e7854"/></marker></defs><rect width="1440" height="1140" fill="#f6f8f1"/><g font-family="DejaVu Sans, sans-serif"><text x="64" y="52" font-size="16" fill="#596f52" font-weight="600">FARID WAJIDI  /  S3 INFORMATIKA · UNIVERSITAS AMIKOM YOGYAKARTA</text><text x="64" y="112" font-size="43" fill="#183b2b" font-weight="600">Puzzle penelitian: cakupan relasi intra-kelas</text><text x="64" y="148" font-size="21" fill="#5b6f51" font-weight="400">Domain generalization · segmentasi semantik adegan jalan · identifikasi awal</text><g transform="translate(64,194)"><path d="M24 0 H248 C248 0 248 32 280 32 C312 32 312 0 312 0 H556 Q580 0 580 24 V90 C580 90 612 90 612 122 C612 154 580 154 580 154 V256 Q580 280 556 280 H332 C332 280 332 248 300 248 C268 248 268 280 268 280 H24 Q0 280 0 256 V180 C0 180 32 180 32 148 C32 116 0 116 0 116 V24 Q0 0 24 0 Z" fill="#e5eed7" stroke="#507342" stroke-opacity=".35" stroke-width="1.5"/></g><text x="116" y="246" font-size="18" fill="#507342" font-weight="700">01</text><text x="160" y="246" font-size="14" fill="#507342" font-weight="600">SINTESIS 12 ARTIKEL</text><text x="116" y="292" font-size="31" fill="#17382b" font-weight="600">SoTA</text><text x="116" y="337" font-size="23" fill="#37543f" font-weight="400">Kendali semantik membantu generalisasi.</text><text x="116" y="369" font-size="23" fill="#37543f" font-weight="400">Manfaat agregat, kategori, domain,</text><text x="116" y="401" font-size="23" fill="#37543f" font-weight="400">dan biaya tidak selalu bergerak bersama.</text><text x="116" y="438" font-size="16" fill="#56684d" font-weight="400">Relasi · konsistensi · alignment · prototype · gaya</text><g transform="translate(776,194)"><path d="M24 0 H248 C248 0 248 32 280 32 C312 32 312 0 312 0 H556 Q580 0 580 24 V90 C580 90 612 90 612 122 C612 154 580 154 580 154 V256 Q580 280 556 280 H332 C332 280 332 248 300 248 C268 248 268 280 268 280 H24 Q0 280 0 256 V180 C0 180 32 180 32 148 C32 116 0 116 0 116 V24 Q0 0 24 0 Z" fill="#f0e8d9" stroke="#88623f" stroke-opacity=".35" stroke-width="1.5"/></g><text x="828" y="246" font-size="18" fill="#88623f" font-weight="700">02</text><text x="872" y="246" font-size="14" fill="#88623f" font-weight="600">SEMENTARA · SEBAB MASIH HIPOTESIS</text><text x="828" y="292" font-size="31" fill="#17382b" font-weight="600">Research Gap</text><text x="828" y="337" font-size="23" fill="#37543f" font-weight="400">Apakah cakupan intra-kelas yang terbatas</text><text x="828" y="369" font-size="23" fill="#37543f" font-weight="400">pada instance ikut menjelaskan perubahan</text><text x="828" y="401" font-size="23" fill="#37543f" font-weight="400">stuff saat ITARL digabung dengan DIERL?</text><text x="828" y="438" font-size="16" fill="#56684d" font-weight="400">Z. Li &amp; Liao (2025), Tabel 5; bagian 3.3 dan 4.8</text><g transform="translate(776,590)"><path d="M24 0 H248 C248 0 248 32 280 32 C312 32 312 0 312 0 H556 Q580 0 580 24 V90 C580 90 612 90 612 122 C612 154 580 154 580 154 V256 Q580 280 556 280 H332 C332 280 332 248 300 248 C268 248 268 280 268 280 H24 Q0 280 0 256 V180 C0 180 32 180 32 148 C32 116 0 116 0 116 V24 Q0 0 24 0 Z" fill="#e2eddc" stroke="#507342" stroke-opacity=".35" stroke-width="1.5"/></g><text x="828" y="642" font-size="18" fill="#507342" font-weight="700">03</text><text x="872" y="642" font-size="14" fill="#507342" font-weight="600">USULAN EMPIRIS / ANALITIS</text><text x="828" y="688" font-size="31" fill="#17382b" font-weight="600">Potential Novelty</text><text x="828" y="733" font-size="23" fill="#37543f" font-weight="400">Uji cakupan relasi dengan kontrol setara:</text><text x="828" y="765" font-size="23" fill="#37543f" font-weight="400">informasi relasi, kapasitas, pengawasan,</text><text x="828" y="797" font-size="23" fill="#37543f" font-weight="400">dan bobot loss. Intervensi belum diuji.</text><text x="828" y="834" font-size="16" fill="#56684d" font-weight="400">Pembeda terhadap studi serupa belum terverifikasi penuh.</text><g transform="translate(64,590)"><path d="M24 0 H248 C248 0 248 32 280 32 C312 32 312 0 312 0 H556 Q580 0 580 24 V90 C580 90 612 90 612 122 C612 154 580 154 580 154 V256 Q580 280 556 280 H332 C332 280 332 248 300 248 C268 248 268 280 268 280 H24 Q0 280 0 256 V180 C0 180 32 180 32 148 C32 116 0 116 0 116 V24 Q0 0 24 0 Z" fill="#dce8d3" stroke="#446b3c" stroke-opacity=".35" stroke-width="1.5"/></g><text x="116" y="642" font-size="18" fill="#446b3c" font-weight="700">04</text><text x="160" y="642" font-size="14" fill="#446b3c" font-weight="600">POTENSIAL · BELUM DIHASILKAN</text><text x="116" y="688" font-size="31" fill="#17382b" font-weight="600">Potential Contribution</text><text x="116" y="733" font-size="23" fill="#37543f" font-weight="400">Pengetahuan tentang kapan perluasan</text><text x="116" y="765" font-size="23" fill="#37543f" font-weight="400">membantu, tidak membantu, atau mengubah</text><text x="116" y="797" font-size="23" fill="#37543f" font-weight="400">kompromi hasil kelompok stuff–instance.</text><text x="116" y="834" font-size="16" fill="#56684d" font-weight="400">Hasil positif maupun nol perlu kontrol dan variabilitas.</text><path d="M688 334 H754" stroke="#5e7854" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="720" y="310" font-size="16" fill="#5e7854" font-weight="700" text-anchor="middle">1</text><text x="65" y="528" font-size="19" fill="#5b7050" font-weight="400">1  Batas manfaat agregat memotivasi pertanyaan tentang cakupan.</text><path d="M1066 486 V565" stroke="#5e7854" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1100" y="520" font-size="17" fill="#5b7050" font-weight="400">2  Memerlukan</text><text x="1125" y="544" font-size="17" fill="#5b7050" font-weight="400">intervensi terkontrol</text><path d="M755 730 H694" stroke="#5e7854" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="721" y="706" font-size="16" fill="#5e7854" font-weight="700" text-anchor="middle">3</text><text x="65" y="916" font-size="19" fill="#5b7050" font-weight="400">3  Hasil terkontrol berpotensi memberi pengetahuan tentang kondisi dan batas manfaat.</text><rect x="64" y="949" width="1316" height="77" rx="13" fill="#183b2d"/><text x="87" y="979" font-size="16" fill="#d9e8c7" font-weight="600">BUKTI PENENTU · GTA5→Cityscapes · ShuffleNetV2 · DIERL→GVRL lengkap</text><text x="87" y="1007" font-size="19" fill="#e9f3df" font-weight="400">mIoU 36,2→36,9  |  instance 21,4→24,4  |  stuff 56,6→54,2  (tetap &gt; baseline 49,4)</text><text x="1380" y="54" font-size="14" fill="#6c7e5f" font-weight="600" text-anchor="end">UNTUK PROF. EMA</text><text x="64" y="1063" font-size="19" fill="#526849" font-weight="400">Panah menunjukkan alur argumentasi, bukan hubungan sebab yang sudah terbukti.</text><text x="64" y="1093" font-size="19" fill="#526849" font-weight="400">Penurunan stuff adalah rerata kelompok pada satu pasangan; tidak berarti semua kelas stuff menurun.</text></g></svg>